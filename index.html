<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moonbow">
<meta name="theme-color" content="#0f0c29">
<title>Moonbow Fairy Quest</title>
<!-- Fonts: if there's no internet, the system rounded fonts below take over. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
/* =========================================================
   STYLES
   ========================================================= */
:root {
  --ink: #1d1838;
  --sun: #F7C948;
  --lilac: #E7CCF7;
  --head: 'Fredoka', 'Arial Rounded MT Bold', 'Avenir Next Rounded', ui-rounded, system-ui, sans-serif;
  --body: 'Nunito', 'Avenir Next', ui-rounded, system-ui, sans-serif;
}
html, body { margin: 0; height: 100%; background: #07061a; overflow: hidden; overscroll-behavior: none; }
body {
  position: fixed; inset: 0;
  font-family: var(--body);
  touch-action: manipulation;              /* no double-tap zoom on iPad */
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

/* The 1280x720 stage. JavaScript scales it to fit the screen (letterboxed). */
#stage {
  position: absolute; left: 0; top: 0;
  width: 1280px; height: 720px;
  transform-origin: 0 0;
  overflow: hidden;
  background: #0f0c29;
  color: var(--ink);
}
#scene, .screen, #fx { position: absolute; inset: 0; }
#fx { pointer-events: none; z-index: 20; }
.screen > svg.bg { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
.layer { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; pointer-events: none; }
.layer svg { width: 1280px; height: 720px; }

/* Dahlia's drawing style: thick dark outlines, round ends */
svg .s { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
svg .n { fill: none; }

/* ---------- Text bits ---------- */
.scene-title {
  position: absolute; left: 40px; top: 30px;
  display: flex; gap: 12px; align-items: center;
  font-family: var(--head); font-weight: 700; font-size: 34px; color: #fff;
  text-shadow: 0 2px 10px rgba(0,0,0,.35);
  pointer-events: none;
}
.scene-title .tag {
  background: var(--sun); color: var(--ink); font-size: 16px; letter-spacing: .06em;
  padding: 8px 16px; border-radius: 999px; text-shadow: none;
}

/* Speech bubble. --tail-x moves the little pointer. */
.bubble {
  position: absolute; z-index: 10;
  background: #fff; border-radius: 28px;
  padding: 20px 24px 34px;
  font-weight: 800; font-size: 27px; line-height: 1.3; color: var(--ink);
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
  animation: pop .38s cubic-bezier(.3,1.6,.5,1) both;
}
.bubble::after {
  content: ''; position: absolute; bottom: -12px; left: var(--tail-x, 60px);
  width: 28px; height: 28px; background: #fff; border-radius: 4px; transform: rotate(45deg);
}
.bubble .who {
  position: absolute; top: -18px; left: 20px;
  background: var(--sun); font-family: var(--head); font-weight: 700; font-size: 18px;
  padding: 4px 14px; border-radius: 999px;
}
.bubble .more, .card .more {
  position: absolute; right: 20px; bottom: 8px;
  font-family: var(--head); font-size: 17px; font-weight: 600; color: #B07BE0;
  animation: nudge 1.1s ease-in-out infinite;
}

/* Story card (big centered text) */
.card {
  position: absolute; z-index: 10;
  left: 50%; transform: translateX(-50%);
  background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.3);
  border-radius: 32px; padding: 30px 40px 46px;
  color: #fff; font-size: 34px; font-weight: 800; line-height: 1.4; text-align: center;
  box-shadow: 0 14px 50px rgba(0,0,0,.35);
  animation: fadeUp .7s ease both;
}

/* Taps anywhere to go to the next line */
.catcher { position: absolute; inset: 0; z-index: 9; cursor: pointer; }

/* ---------- Buttons (all at least 88px tall on the 1280 stage = 70px on an iPad) ---------- */
.bottom { position: absolute; left: 0; right: 0; bottom: 28px; display: flex; justify-content: center; gap: 24px; z-index: 8; pointer-events: none; }
.bottom > * { pointer-events: auto; }
.btn {
  font-family: var(--head); font-weight: 600; font-size: 34px; color: var(--ink);
  background: var(--sun); border: none; border-radius: 999px;
  padding: 0 56px; min-height: 88px; min-width: 88px;
  box-shadow: 0 8px 24px rgba(247,201,72,.45), inset 0 -6px 0 rgba(0,0,0,.12);
  cursor: pointer; animation: pop .4s cubic-bezier(.3,1.6,.5,1) both;
}
.btn.big { font-size: 48px; min-height: 120px; padding: 0 80px; }
.btn.soft { background: rgba(255,255,255,.16); color: #fff; box-shadow: inset 0 0 0 3px rgba(255,255,255,.4); }
/* A hint pill tells her what to do. Tapping it makes the target glow. */
.hint-pill {
  font-family: var(--head); font-weight: 600; font-size: 30px; color: #fff;
  background: rgba(29,24,56,.78); border: 3px solid rgba(255,255,255,.35);
  border-radius: 999px; padding: 0 44px; min-height: 84px;
  display: flex; align-items: center; cursor: pointer;
  animation: pop .4s cubic-bezier(.3,1.6,.5,1) both, breathe 2.4s ease-in-out .4s infinite;
}

/* ---------- Grown-up corner buttons ---------- */
#hud { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
#hud button { pointer-events: auto; cursor: pointer; border: none; }
#muteBtn {
  position: absolute; right: 20px; top: 20px; width: 84px; height: 84px; border-radius: 50%;
  background: rgba(255,255,255,.16); box-shadow: inset 0 0 0 3px rgba(255,255,255,.35);
  display: flex; align-items: center; justify-content: center;
}
#restartBtn {
  position: absolute; left: 16px; bottom: 14px; height: 56px; padding: 0 20px; border-radius: 999px;
  background: rgba(0,0,0,.28); color: rgba(255,255,255,.75);
  font-family: var(--body); font-weight: 800; font-size: 17px;
}
#hud.on-title #restartBtn { display: none; }

/* ---------- Screen change: moon-dust fade ---------- */
#wipe {
  position: absolute; inset: 0; z-index: 40; pointer-events: none; opacity: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,246,201,.9) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 20%, rgba(255,246,201,.8) 0 2px, transparent 3px),
    radial-gradient(circle at 40% 75%, rgba(231,204,247,.9) 0 3px, transparent 4px),
    radial-gradient(circle at 85% 65%, rgba(255,246,201,.8) 0 2px, transparent 3px),
    radial-gradient(circle at 55% 45%, rgba(231,204,247,.7) 0 2px, transparent 3px),
    radial-gradient(ellipse at center, #3d3470 0%, #151236 75%);
  background-size: 180px 180px, 230px 230px, 260px 260px, 200px 200px, 150px 150px, 100% 100%;
  transition: opacity .3s ease;
}
#wipe.on { opacity: 1; pointer-events: auto; }
#flash { position: absolute; inset: 0; z-index: 39; background: #fff; opacity: 0; pointer-events: none; }

/* ---------- Animations ---------- */
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.card { animation-name: fadeUp; }
@keyframes fadeUp { from { opacity: 0; transform: translate(-50%, 24px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
@keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
@keyframes bob { 0%,100% { transform: translateY(-8px); } 50% { transform: translateY(8px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes glowPulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
@keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(.78); } }
@keyframes boing { 0% { transform: scale(1); } 30% { transform: scale(.9); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }

/* SVG bits that animate around their own middle */
.tw    { animation: twinkle 2.6s ease-in-out infinite; }
.bob   { animation: bob 3.2s ease-in-out infinite; }
.spin  { transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite; }
.pulse { animation: glowPulse 2.2s ease-in-out infinite; }
.pulse.strong { animation-duration: .9s; }
.flap  { transform-box: fill-box; transform-origin: center; animation: flap .45s ease-in-out infinite alternate; }
/* IMPORTANT: never put .tappable on an SVG element that has its own transform="..." —
   wrap it in a <g transform="..."> instead, or the bounce will move it. */
.tappable { cursor: pointer; transform-box: fill-box; transform-origin: center; }
.boing { animation: boing .38s ease; }

/* The letter in "The Royal Secret" */
.letter-paper { transition: transform .7s cubic-bezier(.3,1.4,.5,1) .15s; }
.letter.open .letter-paper { transform: translateY(-44px); }
.letter-flap-open { opacity: 0; transition: opacity .2s; }
.letter.open .letter-flap-open { opacity: 1; }
.letter-flap, .letter-seal { transition: opacity .2s; }
.letter.open .letter-flap, .letter.open .letter-seal { opacity: 0; }

/* Title screen */
.title-text {
  position: absolute; left: 0; right: 0; top: 52px; margin: 0; text-align: center;
  font-family: var(--head); font-weight: 700; font-size: 96px; color: #fff; letter-spacing: .01em;
  text-shadow:
    0 0 0 #1d1838, 4px 4px 0 #1d1838, -4px 4px 0 #1d1838, 4px -4px 0 #1d1838, -4px -4px 0 #1d1838,
    0 5px 0 #1d1838, 0 -5px 0 #1d1838, 5px 0 0 #1d1838, -5px 0 0 #1d1838,
    0 10px 30px rgba(0,0,0,.5);
  pointer-events: none; animation: pop .7s cubic-bezier(.3,1.5,.5,1) both;
}
.title-sub {
  position: absolute; left: 0; right: 0; top: 178px; text-align: center;
  font-family: var(--head); font-weight: 600; font-size: 26px; color: var(--lilac);
  text-shadow: 0 2px 8px rgba(0,0,0,.6); pointer-events: none;
}
.center-col { position: absolute; left: 0; right: 0; top: 330px; display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 8; }

/* ---------- Fairy World ---------- */
.layer .tappable { pointer-events: auto; }
/* Colors fade back in smoothly when a fairy is found */
.moonbow-stripe { transition: stroke 1.4s ease; }
[data-tint] { transition: fill 1.4s ease; }

/* "Moonbow fairies found: 1 of 5" */
.counter {
  position: absolute; right: 124px; top: 22px; z-index: 8;
  background: #fff; border-radius: 22px; padding: 10px 18px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,.2); pointer-events: none;
}
.counter .lbl { font-family: var(--head); font-weight: 600; font-size: 19px; }
.counter .dots { display: flex; gap: 10px; }
.counter .dot { width: 30px; height: 30px; border-radius: 50%; border: 3px dashed #8a8a92; box-sizing: border-box; }
.counter .dot.on { border: 3px solid var(--ink); animation: pop .6s cubic-bezier(.3,1.6,.5,1); }

/* ---------- Power cards ---------- */
.cards { position: absolute; left: 40px; right: 40px; top: 120px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; z-index: 6; }
.pcard {
  background: #fff; border-radius: 28px; padding: 16px 16px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  box-shadow: 0 14px 40px rgba(0,0,0,.35);
  animation: pop .5s cubic-bezier(.3,1.5,.5,1) both;
}
.pcard.keeper { background: #2b2552; box-shadow: 0 0 0 3px #B07BE0, 0 14px 40px rgba(176,123,224,.35); color: #fff; }
.pcard .pname { font-family: var(--head); font-weight: 700; font-size: 28px; }
.pcard .pwho { font-family: var(--head); font-weight: 600; font-size: 17px; color: #8a6fc0; margin-top: -6px; }
.pcard.keeper .pwho { color: var(--lilac); }
.pcard .ptext { font-size: 18px; line-height: 1.35; text-align: center; color: #4a4560; }
.pcard.keeper .ptext { color: var(--lilac); }

/* ---------- Power puzzles ---------- */
@keyframes shimmer { 0%,100% { opacity: .05; } 50% { opacity: .22; } }
.shimmer { animation: shimmer 2.4s ease-in-out infinite; }
@keyframes drift { 0%,100% { transform: translateX(-24px); } 50% { transform: translateX(24px); } }
.drift { animation: drift 7s ease-in-out infinite; }

/* "Not here..." words that float up after tapping a sparkle */
.float-text {
  position: absolute; z-index: 12; pointer-events: none; white-space: nowrap;
  font-family: var(--head); font-weight: 700; font-size: 34px; color: #fff;
  text-shadow: 0 0 4px #1d1838, 0 3px 0 #1d1838, 0 0 18px rgba(0,0,0,.5);
}
</style>
</head>
<body>

<div id="stage">
  <div id="scene"></div>
  <div id="fx"></div>
  <div id="hud">
    <button id="muteBtn" aria-label="Sound on or off"></button>
    <button id="restartBtn">&#8634; Start over</button>
  </div>
  <div id="flash"></div>
  <div id="wipe"></div>
</div>

<!-- Shared glows, used by every scene -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="charGlow"><stop offset="0" stop-color="#fff6c9" stop-opacity=".9"/><stop offset="1" stop-color="#fff6c9" stop-opacity="0"/></radialGradient>
    <radialGradient id="starGlow"><stop offset="0" stop-color="#fff6c9" stop-opacity=".95"/><stop offset="1" stop-color="#fff6c9" stop-opacity="0"/></radialGradient>
    <radialGradient id="lilacGlow"><stop offset="0" stop-color="#E7CCF7" stop-opacity=".6"/><stop offset="1" stop-color="#E7CCF7" stop-opacity="0"/></radialGradient>
    <!-- one soft glow per fairy, matching her color -->
    <radialGradient id="fairyGlow0"><stop offset="0" stop-color="#E8826A" stop-opacity=".7"/><stop offset="1" stop-color="#E8826A" stop-opacity="0"/></radialGradient>
    <radialGradient id="fairyGlow1"><stop offset="0" stop-color="#ffffff" stop-opacity=".8"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <radialGradient id="fairyGlow2"><stop offset="0" stop-color="#E7CCF7" stop-opacity=".8"/><stop offset="1" stop-color="#E7CCF7" stop-opacity="0"/></radialGradient>
    <radialGradient id="fairyGlow3"><stop offset="0" stop-color="#8E86C9" stop-opacity=".75"/><stop offset="1" stop-color="#8E86C9" stop-opacity="0"/></radialGradient>
    <radialGradient id="fairyGlow4"><stop offset="0" stop-color="#4FB3A9" stop-opacity=".75"/><stop offset="1" stop-color="#4FB3A9" stop-opacity="0"/></radialGradient>
  </defs>
</svg>

<script>
/* =========================================================
   CONFIG — change names here. The game reads them from here.
   ========================================================= */
const CONFIG = {
  title:  'Moonbow Fairy Quest',
  girl1:  'Heart',         // pink hat, yellow dress, heart wand — power: Teleport
  girl2:  'Diamond',       // teal hat, blue dress, diamond wand — power: Move Things
  girl3:  'Star',          // purple striped hat, orange dress, star wand — power: Spells
  keeper: 'Power Keeper',  // tall purple hat, holds a flower
  // The 5 Moonbow Fairies, outside stripe to inside stripe
  fairies: ['Coral', 'Pearl', 'Midnight', 'Lavender', 'Teal'],
};

/* =========================================================
   STORY — every line of text in the game. Edit freely!
   {girl1} {girl2} {girl3} {keeper} get swapped for the names above.
   ========================================================= */
const STORY = {
  titleSub: 'A story by Dahlia',
  storyCard: 'Once upon a time, three girls lost their mom. Now she shines as the brightest star, watching over them.',

  secretTitle: 'The Royal Secret',
  secretHint: 'Tap the letter to open it',
  secretLines: [
    'Girls, this letter is from the castle. You are princesses!',
    'And princesses go on adventures. Come with me, I know a secret door!',
  ],

  portalTitle: 'The Moon Portal',
  portalLines: ['Hold hands, everyone. This door goes to Fairy World!'],
  portalHint: 'Tap the portal to jump in!',

  // {fairy0} {fairy1} ... are the fairies' names from CONFIG.fairies
  grayTitle: 'Fairy World Lost Its Color',
  grayLines: [
    { who: 'girl1',  text: 'Oh no! Where did all the colors go?' },
    { who: 'keeper', text: 'The five Moonbow Fairies are lost. Without them, Fairy World turns gray.' },
    { who: 'girl3',  text: "Let's find them and bring the colors back!" },
  ],
  grayNext: "Let's look! &#9656;",

  searchHint: 'Tap the sparkles to look for a fairy!',
  notHere: ['Not here...', 'Keep looking!', 'Getting closer!'],

  meadowTitle: 'Mushroom Meadow',
  meadowLines: [
    "I'm {fairy0}, the first Moonbow Fairy! Thank you for finding me!",
    'My sister {fairy1} is hiding in the Flower Garden. Look near the biggest flower!',
  ],
  meadowNext: 'To the Flower Garden &#9656;',

  gardenTitle: 'Flower Garden',
  gardenLines: [
    "I'm {fairy1}, the second Moonbow Fairy! You found me!",
    '{fairy0} and I have a big surprise for you. Come with us!',
  ],
  gardenNext: 'Follow the fairies &#9656;',

  powersTitle: 'We Have Powers!',
  powersLines: [
    { who: 'fairy0', text: 'Sprinkle, sprinkle! Moon dust for our brave friends!' },
    { who: 'fairy1', text: "Now each of you has a secret power. Let's see!" },
  ],
  // The 4 power cards, shown one at a time
  powerCards: [
    { who: 'girl1',  power: 'Teleport',     text: 'Poof! She can zip to another part of Fairy World in a flash.' },
    { who: 'girl2',  power: 'Move Things',  text: 'She can lift rocks, leaves and logs to see who is hiding.' },
    { who: 'girl3',  power: 'Spells',       text: 'She waves her star wand and says magic words to make hidden things appear.' },
    { who: 'keeper', power: 'Power Keeper', text: 'She decides when the girls can use their powers. Tap her flower to wake them up!' },
  ],
  cardsHint: 'Tap to see the next power',
  powersNext: "Let's find the other fairies! &#9656;",

  // Used in all three power puzzles
  flowerHint: "Tap {keeper}'s flower to wake up the powers!",
  flowerFirst: 'Tap the flower first!',
  powersAwake: 'Powers, wake up!',
  pickHint: 'Who has the right power? Tap a princess!',
  wrongPower: 'Hmm, try another power!',

  rockyTitle: 'Rocky Hill',
  rockyIntro: [
    { who: 'fairy2', text: "Help! I'm stuck under this big rock!" },
    { who: 'keeper', text: 'We need someone who can move heavy things...' },
  ],
  rockyDone: [
    "I'm {fairy2}, the third Moonbow Fairy! Thank you, {girl2}!",
    'My sister {fairy3} is at the Misty Pond. She is very hard to see!',
  ],
  rockyNext: 'To the Misty Pond &#9656;',

  pondTitle: 'Misty Pond',
  pondIntro: [
    { who: 'fairy3', text: "I'm right here! But I'm invisible, so nobody can see me!" },
    { who: 'keeper', text: 'We need a magic spell to make hidden things appear...' },
  ],
  pondDone: [
    "I'm {fairy3}, the fourth Moonbow Fairy! Your spell worked, {girl3}!",
    'The last fairy, {fairy4}, is far away on a cloud island in the sky.',
  ],
  pondNext: 'To the Cloud Island &#9656;',

  cloudTitle: 'Floating Cloud Island',
  cloudIntro: [
    { who: 'fairy4', text: "Yoo-hoo! I'm way over here, on the cloud island!" },
    { who: 'keeper', text: "It's much too far to walk. Who can zip there in a flash?" },
  ],
  cloudDone: [
    "I'm {fairy4}, the fifth Moonbow Fairy! Thank you for coming to get me, {girl1}!",
    'Now all five of us are home. Look up at the sky!',
  ],
  cloudNext: 'See the moonbow &#9656;',
};

/* The moonbow's 5 colors, outside to inside. One per fairy. */
const MOONBOW = ['#E8826A', '#F4F1EA', '#2A2633', '#8E86C9', '#4FB3A9'];


/* =========================================================
   LITTLE HELPERS
   ========================================================= */
const $ = (sel, root = document) => root.querySelector(sel);
function el(tag, cls, parent) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (parent) parent.appendChild(e);
  return e;
}
// A character's name: 'girl1' -> CONFIG.girl1, 'fairy0' -> CONFIG.fairies[0]
function nameOf(who) {
  const f = /^fairy(\d)$/.exec(who);
  return f ? CONFIG.fairies[+f[1]] : CONFIG[who];
}
// Swap {girl1}, {fairy0} etc. in story text for names from CONFIG
function fill(text) {
  return text.replace(/\{(\w+)\}/g, (m, key) => nameOf(key) || m);
}
const wait = ms => new Promise(r => setTimeout(r, ms));

// A repeatable "random" so the stars are in the same spots every time
function seeded(seed) {
  let s = seed;
  return () => (s = (s * 16807) % 2147483647) / 2147483647;
}


/* =========================================================
   SAVE — remembers where she got to (localStorage)
   ========================================================= */
const Save = {
  KEY: 'moonbowFairyQuest.v1',
  data: { screen: 'title', found: 0, muted: false },
  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      if (raw) Object.assign(this.data, JSON.parse(raw));
    } catch (e) { /* private mode etc. — just play without saving */ }
  },
  write() {
    try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) {}
  },
  reset() {
    this.data = { screen: 'title', found: 0, muted: this.data.muted };
    this.write();
  },
};


/* =========================================================
   SOUND — tiny sound effects made with the Web Audio API
   ========================================================= */
const Sound = {
  ctx: null,
  // iPad only allows sound after a tap, so we start it on the first tap
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  note(freq, start, dur, { type = 'sine', vol = 0.12, to = null } = {}) {
    const c = this.ctx, t = c.currentTime + start;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.05);
  },
  noise(start, dur, { from = 400, to = 2400, vol = 0.15 } = {}) {
    const c = this.ctx, t = c.currentTime + start;
    const buf = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(t); src.stop(t + dur);
  },
  play(name) {
    if (Save.data.muted) return;
    this.unlock();
    if (!this.ctx) return;
    switch (name) {
      case 'tick':    this.note(1300, 0, 0.06, { vol: 0.035 }); break;          // tap on nothing
      case 'pop':     this.note(520, 0, 0.13, { to: 900, vol: 0.12 }); break;   // tap a button
      case 'sparkle': [1047, 1319, 1568, 2093].forEach((f, i) => this.note(f, i * 0.08, 0.28, { type: 'triangle', vol: 0.07 })); break;
      case 'chime':   [523, 659, 784, 1047].forEach((f, i) => this.note(f, i * 0.12, 0.6, { vol: 0.1 })); break;
      case 'paper':   this.noise(0, 0.28, { from: 1800, to: 4200, vol: 0.09 }); break;
      case 'whoosh':  this.noise(0, 1.3, { from: 250, to: 3200, vol: 0.16 }); this.note(220, 0, 1.3, { to: 880, vol: 0.05 }); break;
      case 'cheer':   this.play('chime'); setTimeout(() => this.play('sparkle'), 380); break;
      case 'hmm':     this.note(392, 0, 0.2, { vol: 0.08 }); this.note(330, 0.2, 0.32, { vol: 0.08 }); break;
      case 'poof':    this.noise(0, 0.35, { from: 3200, to: 500, vol: 0.13 }); this.note(880, 0, 0.25, { to: 1760, vol: 0.06 }); break;
      case 'lift':    this.note(196, 0, 0.9, { type: 'triangle', to: 523, vol: 0.09 }); break;
    }
  },
};


/* =========================================================
   TAP FEEDBACK — bounce + sparkle + sound on every tap
   ========================================================= */
let stageScale = 1;
const stage = $('#stage');

// Turn a finger position into a spot on the 1280x720 stage
function stagePoint(e) {
  const r = stage.getBoundingClientRect();
  return { x: (e.clientX - r.left) / stageScale, y: (e.clientY - r.top) / stageScale };
}

function boing(target) {
  target.classList.remove('boing');
  void target.getBoundingClientRect(); // restart the animation
  target.classList.add('boing');
}

// Little stars that burst out where she tapped
function sparkleAt(x, y, count = 8, colors = ['#fff6c9', '#F7C948', '#E7CCF7', '#7FD6E8']) {
  const fx = $('#fx');
  for (let i = 0; i < count; i++) {
    const s = el('div', '', fx);
    const size = 14 + Math.random() * 12;
    s.style.cssText = `position:absolute;left:${x - size / 2}px;top:${y - size / 2}px;width:${size}px;height:${size}px;`;
    s.innerHTML = `<svg viewBox="-10 -10 20 20" width="${size}" height="${size}"><path d="M0 -10 Q1.5 -1.5 10 0 Q1.5 1.5 0 10 Q-1.5 1.5 -10 0 Q-1.5 -1.5 0 -10Z" fill="${colors[i % colors.length]}"/></svg>`;
    const a = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const dist = 40 + Math.random() * 40;
    s.animate([
      { transform: 'translate(0,0) scale(.4) rotate(0deg)', opacity: 1 },
      { transform: `translate(${Math.cos(a) * dist}px,${Math.sin(a) * dist}px) scale(1) rotate(90deg)`, opacity: 0 },
    ], { duration: 600 + Math.random() * 200, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => s.remove();
  }
}

// Make anything tappable: bounce + sparkle + sound right away, then run fn
function onTap(target, fn, sound = 'pop') {
  target.classList.add('tappable');
  target.addEventListener('pointerdown', e => {
    boing(target);
    const p = stagePoint(e);
    sparkleAt(p.x, p.y);
    Sound.play(sound);
  });
  target.addEventListener('click', e => { e.stopPropagation(); fn(e); });
}

// Taps on the black bars around the stage still move the story along
document.addEventListener('click', e => {
  if (e.target === document.body || e.target === document.documentElement) {
    const c = $('#scene .catcher');
    if (c) { Sound.play('tick'); c.click(); }
  }
});

// Taps on empty space still get a tiny sparkle
stage.addEventListener('pointerdown', e => {
  Sound.unlock();
  if (e.target.closest('.tappable, #hud button')) return;
  const p = stagePoint(e);
  sparkleAt(p.x, p.y, 5);
  Sound.play('tick');
});


/* =========================================================
   CHARACTER ART — Dahlia's characters as reusable drawings.
   Each drawX() returns an SVG <g> string in its own little
   coordinate box. Use place() to put it on the stage.

   Options for the girls and the keeper:
     pose:  'down'  arms down (default)
            'out'   arms out to the sides (holding hands)
            'up'    both arms up (cheering)
            'power' wand held up high (using her power)
     mouth: 'smile' (default) or 'grin' (big open happy mouth)
     glow:  true to give her a soft magic glow
   ========================================================= */

// Where each arm ends up for each pose (offset from the shoulder)
const POSES = {
  down:  { L: [-32, 48],  R: [32, 48] },
  out:   { L: [-50, 0],   R: [50, -8] },
  up:    { L: [-32, -52], R: [32, -52] },
  power: { L: [-32, 48],  R: [32, 48], raise: [40, -58] },
};

// Info about each character's body so arms, wands and feet line up

  girl1:  { cx: 80, feetY: 339, skin: '#8d5a3b', shoulderL: [72, 168], shoulderR: [88, 168], wand: 'heart',   wandHand: 'L', reach: 1 },
  girl2:  { cx: 80, feetY: 363, skin: '#6b4027', shoulderL: [72, 164], shoulderR: [88, 164], wand: 'diamond', wandHand: 'L', reach: 1 },
  girl3:  { cx: 84, feetY: 311, skin: '#a9714b', shoulderL: [74, 168], shoulderR: [94, 168], wand: 'star',    wandHand: 'R', reach: 1 },
  keeper: { cx: 80, feetY: 401, skin: '#7a4a2e', shoulderL: [70, 188], shoulderR: [90, 188], wand: 'flower',  wandHand: 'L', reach: 1.25 },
};

// --- small shapes ---
function heartShape(x, y, fill = '#E86A92') { // (x, y) = bottom point of the heart
  return `<path class="s" style="stroke-width:3" fill="${fill}" d="M${x} ${y} C${x - 10} ${y - 10} ${x - 12} ${y - 20} ${x - 4} ${y - 22} C${x - 1} ${y - 23} ${x} ${y - 19} ${x} ${y - 17} C${x} ${y - 19} ${x + 1} ${y - 23} ${x + 4} ${y - 22} C${x + 12} ${y - 20} ${x + 10} ${y - 10} ${x} ${y} Z"/>`;
}
function starPoints(cx, cy, R, r) {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const a = (-90 + i * 36) * Math.PI / 180, rad = i % 2 ? r : R;
    pts.push(`${(cx + Math.cos(a) * rad).toFixed(1)},${(cy + Math.sin(a) * rad).toFixed(1)}`);
  }
  return pts.join(' ');
}
function starShape(cx, cy, R, fill = '#F7C948', sw = 3) {
  return `<polygon class="s" style="stroke-width:${sw}" fill="${fill}" points="${starPoints(cx, cy, R, R * 0.45)}"/>`;
}
function diamondShape(x, y, fill = '#8E86C9') { // (x, y) = bottom point
  return `<polygon class="s" style="stroke-width:3" fill="${fill}" points="${x},${y - 32} ${x + 10},${y - 16} ${x},${y} ${x - 10},${y - 16}"/>`;
}
function flowerShape(cx, cy) {
  return `<g class="flower"><circle class="s" style="stroke-width:3" cx="${cx}" cy="${cy}" r="15" fill="#F7C948"/><circle cx="${cx}" cy="${cy}" r="6" fill="#6b4027"/></g>`;
}

// A wand (or the keeper's flower) held in a hand at (hx, hy)
function wandSVG(kind, hx, hy, side) {
  const tx = hx + side * 10, ty = hy - 36;
  const stem = kind === 'flower' ? ' style="stroke:#2e7d4f"' : '';
  let tip = '';
  if (kind === 'heart')   tip = heartShape(tx, ty + 2);
  if (kind === 'diamond') tip = diamondShape(tx, ty + 2);
  if (kind === 'star')    tip = starShape(tx, ty - 14, 20);
  if (kind === 'flower')  tip = flowerShape(tx, ty - 12);
  return `<path class="s n"${stem} d="M${hx} ${hy} L${tx} ${ty}"/>${tip}`;
}

// Both arms, both hands, and the wand
function armsSVG(body, pose, wandHand) {
  const p = POSES[pose] || POSES.down;
  let lines = '', hands = '';
  ['L', 'R'].forEach(side => {
    const [sx, sy] = side === 'L' ? body.shoulderL : body.shoulderR;
    const sign = side === 'L' ? -1 : 1;
    let [dx, dy] = p[side];
    if (pose === 'power' && side === wandHand) { dx = sign * p.raise[0]; dy = p.raise[1]; }
    const hx = sx + dx * body.reach, hy = sy + dy * body.reach;
    lines += `<path class="s n" d="M${sx} ${sy} L${hx} ${hy}"/>`;
    if (side === wandHand) lines += wandSVG(body.wand, hx, hy, sign);
    hands += `<circle class="s" cx="${hx}" cy="${hy}" r="6" fill="${body.skin}"/>`;
  });
  return lines + hands;
}

function glowSVG(cx, cy, rx, ry) {
  return `<ellipse class="pulse" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#charGlow)"/>`;
}

// Put a character on the stage: x = middle of her body, groundY = where her shoes touch
function place(name, opts, x, groundY, scale = 1) {
  const b = BODY[name];
  const tx = x - b.cx * scale, ty = groundY - b.feetY * scale;
  return `<g transform="translate(${tx.toFixed(1)},${ty.toFixed(1)}) scale(${scale})">${DRAW[name](opts || {})}</g>`;
}
// Same, but she can be tapped and redrawn later with setPerson(). Her <g> gets id "pz-<name>".
function placeTappable(name, opts, x, groundY, scale = 1) {
  const b = BODY[name];
  const tx = x - b.cx * scale, ty = groundY - b.feetY * scale;
  return `<g transform="translate(${tx.toFixed(1)},${ty.toFixed(1)}) scale(${scale})"><g id="pz-${name}">${personInner(name, opts)}</g></g>`;
}
function personInner(name, opts) {
  // an invisible box over her whole body makes her easy to tap
  return DRAW[name](opts || {}) + `<rect x="0" y="-40" width="170" height="${BODY[name].feetY + 50}" fill="transparent"/>`;
}
function setPerson(root, name, opts) {
  const g = $('#pz-' + name, root);
  if (g) g.innerHTML = personInner(name, opts);
}
// Put a fairy on the stage, bobbing up and down. delay staggers the bobbing.
function placeFairy(i, x, y, scale = 1, delay = 0) {

}

// Twinkling stars in the sky
function starsSVG(count, seed, maxY = 420) {
  const rnd = seeded(seed);
  let out = '';
  for (let i = 0; i < count; i++) {
    const x = Math.round(rnd() * 1280), y = Math.round(rnd() * maxY), r = (1.5 + rnd() * 1.6).toFixed(1);
    out += `<circle class="tw" style="animation-delay:${(rnd() * 2.6).toFixed(2)}s" cx="${x}" cy="${y}" r="${r}" fill="#fff"/>`;
  }
  return out;
}

// The moonbow arc. show = which of the 5 stripes have color (others are faint gray).
function moonbowArc(cx, baseY, rx, ry, band, show = [true, true, true, true, true]) {
  let out = `<path d="M${cx - rx} ${baseY} A${rx} ${ry} 0 0 1 ${cx + rx} ${baseY}" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="${band * 6}"/>`;
  MOONBOW.forEach((color, i) => {
    const r1 = rx - i * band, r2 = ry - i * band;
    const stroke = show[i] ? color : 'rgba(200,200,210,.25)';
    out += `<path class="moonbow-stripe" data-i="${i}" d="M${cx - r1} ${baseY} A${r1} ${r2} 0 0 1 ${cx + r1} ${baseY}" fill="none" stroke="${stroke}" stroke-width="${band}"/>`;
  });
  return out;
}

// Mom's star: a soft glowing star
function momStar(cx, cy, R, glowR) {
  return `<circle class="pulse" cx="${cx}" cy="${cy}" r="${glowR}" fill="url(#starGlow)"/>
          <polygon points="${starPoints(cx, cy, R, R * 0.42)}" fill="#fff6c9"/>`;
}

/* =========================================================
   DIALOGUE — speech bubbles and story cards.
   Tap anywhere to go to the next line.
   ========================================================= */
// One speech bubble. who = 'keeper', 'girl1', ... (shows her name), x/y/w = where, tailX = where the pointer is
function bubble(parent, { who, text, x, y, w = 360, tailX = 60 }) {
  const b = el('div', 'bubble', parent);
  b.style.cssText = `left:${x}px;top:${y}px;width:${w}px;--tail-x:${tailX}px`;
  b.innerHTML = (who ? `<span class="who">${nameOf(who)}</span>` : '') +
                `<div>${fill(text)}</div><span class="more">tap &#9656;</span>`;
  return b;
}

// Show lines one after another. Each line: { who, text, x, y, w, tailX, onShow }
function talk(parent, lines) {
  return new Promise(done => {
    let i = 0, current = null;
    const catcher = el('div', 'catcher', parent);
    const next = () => {
      if (current) current.remove();
      if (i >= lines.length) { catcher.remove(); done(); return; }
      const line = lines[i++];
      current = bubble(parent, line);
      if (line.onShow) line.onShow();
    };
    catcher.addEventListener('click', () => next());
    next();
  });
}

// A big story card in the middle of the screen
function storyCard(parent, text, { top = 400, w = 820 } = {}) {
  return new Promise(done => {
    const card = el('div', 'card', parent);
    card.style.top = top + 'px';
    card.style.width = w + 'px';
    card.innerHTML = `${fill(text)}<span class="more">tap &#9656;</span>`;
    const catcher = el('div', 'catcher', parent);
    catcher.addEventListener('click', () => { catcher.remove(); done(card); });
  });
}

// The pill at the bottom that says what to do. Tapping it calls onHint (e.g. make the target glow).
function hintPill(parent, text, onHint) {
  const row = el('div', 'bottom', parent);
  const pill = el('div', 'hint-pill', row);
  pill.textContent = fill(text);
  onTap(pill, () => onHint && onHint());
  return row;
}

// A big yellow button at the bottom
function bottomButton(parent, label, fn, cls = '') {
  const row = el('div', 'bottom', parent);
  const b = el('button', 'btn ' + cls, row);
  b.innerHTML = label;
  onTap(b, fn);
  return row;
}


/* =========================================================
   EFFECTS — confetti, white flash
   ========================================================= */
function confetti(count = 90) {
  const fx = $('#fx');
  const colors = [...MOONBOW, '#F7C948', '#E86A92', '#7FD6E8', '#B07BE0'];
  for (let i = 0; i < count; i++) {
    const c = el('div', '', fx);
    const w = 10 + Math.random() * 10, h = 6 + Math.random() * 10;
    const x = Math.random() * 1280;
    c.style.cssText = `position:absolute;left:${x}px;top:-30px;width:${w}px;height:${h}px;border-radius:${Math.random() < .4 ? '50%' : '3px'};background:${colors[i % colors.length]};`;
    const sway = (Math.random() - 0.5) * 240;
    c.animate([
      { transform: 'translate(0,0) rotate(0deg)' },
      { transform: `translate(${sway}px,790px) rotate(${360 + Math.random() * 720}deg)` },
    ], { duration: 2200 + Math.random() * 1600, delay: Math.random() * 600, easing: 'cubic-bezier(.3,.1,.6,1)', fill: 'backwards' })
      .onfinish = () => c.remove();
  }
}

// Glittery moon dust that drifts down from (x1..x2, y1) to about y2
function moonDust(x1, x2, y1, y2, count = 60) {
  const fx = $('#fx');
  const colors = ['#fff6c9', '#E7CCF7', '#ffffff', '#F7C948', ...MOONBOW.slice(0, 2)];
  for (let i = 0; i < count; i++) {
    const d = el('div', '', fx);
    const size = 5 + Math.random() * 8, color = colors[i % colors.length];
    d.style.cssText = `position:absolute;left:${x1 + Math.random() * (x2 - x1)}px;top:${y1}px;width:${size}px;height:${size}px;border-radius:50%;background:${color};box-shadow:0 0 10px ${color};`;
    d.animate([
      { transform: 'translate(0,0)', opacity: 0 },
      { opacity: 1, offset: 0.2 },
      { transform: `translate(${(Math.random() - 0.5) * 80}px,${y2 - y1 + Math.random() * 60}px)`, opacity: 0 },
    ], { duration: 1800 + Math.random() * 1200, delay: Math.random() * 900, easing: 'ease-in', fill: 'backwards' })
      .onfinish = () => d.remove();
  }
}

// A line of little sparkles from one spot to another (a wand's magic flying through the air)
async function sparkleTrail([x1, y1], [x2, y2], steps = 7, ms = 600) {
  for (let k = 0; k <= steps; k++) {
    const t = k / steps;
    sparkleAt(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t - Math.sin(t * Math.PI) * 60, 5);
    await wait(ms / steps);
  }
}

function flash() {
  return $('#flash').animate([{ opacity: 0 }, { opacity: 1 }, { opacity: 0 }], { duration: 700, easing: 'ease-in-out' }).finished;
}

/* =========================================================
   FAIRY WORLD — the gray-to-color magic.
   A Fairy World screen is a stack of see-through layers:
     1. sky + far hills ........ goes gray
     2. the moonbow arc ........ found stripes are in color
     3. ground, trees, etc. .... goes gray
     4. "tint" things .......... turn a fairy's color when she's found
     5. girls, fairies, sparkles  always in full color
   The gray fades a step each time a fairy is found
   (all gray with 0 fairies, full color with 5).
   ========================================================= */
const SVGNS = 'http://www.w3.org/2000/svg';

function worldLayers(root, { back, front, tints = '', actors = '' }) {
  const shown = MOONBOW.map((c, i) => Save.data.found > i);
  root.innerHTML = `
    <div class="layer world"><svg viewBox="0 0 1280 720">${back}</svg></div>
    <div class="layer"><svg viewBox="0 0 1280 720">${moonbowArc(640, 470, 460, 330, 18, shown)}</svg></div>
    <div class="layer world"><svg viewBox="0 0 1280 720">${front}</svg></div>
    <div class="layer"><svg viewBox="0 0 1280 720">${tints}</svg></div>
    <div class="layer"><svg viewBox="0 0 1280 720"><g id="actorsG">${actors}</g></svg></div>`;
  setGray(root, false);
  fairyCounter(root);
}

// How gray the world is: 1 = all gray, 0 = full color
function setGray(root, animate) {
  const amount = 1 - Save.data.found / MOONBOW.length;
  root.querySelectorAll('.world').forEach(w => {
    w.style.transition = animate ? 'filter 1.8s ease' : 'none';
    w.style.filter = `grayscale(${amount})`;
  });
}

// Color in the moonbow stripes and tint things for every fairy found so far
function paintColors(root) {
  const n = Save.data.found;
  root.querySelectorAll('.moonbow-stripe').forEach(p => { if (+p.dataset.i < n) p.style.stroke = MOONBOW[+p.dataset.i]; });
  root.querySelectorAll('[data-tint]').forEach(e => { if (+e.dataset.tint < n) e.style.fill = e.dataset.color; });
}

// The "Moonbow fairies found" box in the top right
function fairyCounter(root) {
  const c = el('div', 'counter', root);
  c.innerHTML = `<span class="lbl"></span><div class="dots">${MOONBOW.map(() => '<span class="dot"></span>').join('')}</div>`;
  updateCounter(root);
}
function updateCounter(root) {
  const n = Save.data.found;
  const lbl = $('.counter .lbl', root);
  if (!lbl) return;
  lbl.textContent = `Moonbow fairies found: ${n} of ${MOONBOW.length}`;
  root.querySelectorAll('.counter .dot').forEach((d, i) => {
    if (i < n && !d.classList.contains('on')) { d.classList.add('on'); d.style.background = MOONBOW[i]; }
  });
}

// Smoothly change something over time. fn gets t from 0 to 1.
function tween(ms, fn, ease = t => 1 - Math.pow(1 - t, 3)) {
  return new Promise(done => {
    const t0 = performance.now();
    const step = now => {
      const t = Math.min(1, (now - t0) / ms);
      fn(ease(t));
      if (t < 1) requestAnimationFrame(step); else done();
    };
    requestAnimationFrame(step);
  });
}
function fadeOut(node, ms = 400) {
  return tween(ms, t => node.setAttribute('opacity', 1 - t)).then(() => node.remove());
}

// Words that float up and fade, like "Not here..."
function floatText(root, x, y, text) {
  const f = el('div', 'float-text', root);
  f.textContent = fill(text);
  f.style.left = x + 'px';
  f.style.top = y + 'px';
  f.animate([
    { transform: 'translate(-50%,-50%) scale(.6)', opacity: 0 },
    { transform: 'translate(-50%,-90%) scale(1)', opacity: 1, offset: 0.25 },
    { transform: 'translate(-50%,-180%) scale(1)', opacity: 0 },
  ], { duration: 1600, easing: 'ease-out' }).onfinish = () => f.remove();
}

// A glowing sparkle to tap. k = its number in the list.
function sparkleSpot(x, y, k) {
  return `<g transform="translate(${x},${y})"><g class="spot" data-spot="${k}">
    <circle r="62" fill="transparent"/>
    <circle class="pulse" r="52" fill="url(#charGlow)" style="animation-delay:${k * 0.4}s"/>
    <g class="spin" style="animation-duration:6s"><path d="M0 -28 Q4 -4 28 0 Q4 4 0 28 Q-4 4 -28 0 Q-4 -4 0 -28Z" fill="#fff6c9" stroke="#F7C948" stroke-width="2.5"/></g>
    <circle class="tw" cx="24" cy="-22" r="4" fill="#fff"/><circle class="tw" style="animation-delay:1.2s" cx="-22" cy="18" r="3" fill="#fff"/>
  </g></g>`;
}

// A fairy pops out of a sparkle at (fx, fy), flies to (tx, ty), and her color comes back
async function findFairy(root, i, [fx, fy], [tx, ty]) {
  const holder = document.createElementNS(SVGNS, 'g');
  holder.innerHTML = `<g class="bob">${drawFairy(i)}</g>`;
  holder.setAttribute('transform', `translate(${fx},${fy}) scale(0)`);
  $('#actorsG', root).appendChild(holder);
  Sound.play('sparkle');
  sparkleAt(fx, fy, 14);
  // pop out...
  await tween(450, t => holder.setAttribute('transform', `translate(${fx},${fy}) scale(${(1.3 * t).toFixed(3)})`),
    t => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2));
  // ...then swoop up to her spot
  await tween(900, t => {
    const x = fx + (tx - fx) * t, y = fy + (ty - fy) * t - Math.sin(t * Math.PI) * 80;
    holder.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${(1.3 + 0.3 * t).toFixed(3)})`);
  }, t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2));
  await returnColor(root, i, tx, ty);
}

// Fairy i is home: save it, ring of color, world gets less gray, her stripe and things color in
async function returnColor(root, i, x, y) {
  Save.data.found = Math.max(Save.data.found, i + 1);
  Save.write();
  Sound.play('cheer');

  const ring = document.createElementNS(SVGNS, 'circle');
  ring.setAttribute('cx', x); ring.setAttribute('cy', y + 30);
  ring.setAttribute('fill', 'none');
  ring.setAttribute('stroke', MOONBOW[i]);
  ring.setAttribute('stroke-width', 36);
  const actors = $('#actorsG', root);
  actors.insertBefore(ring, actors.firstChild);
  tween(1500, t => { ring.setAttribute('r', 20 + t * 1000); ring.setAttribute('opacity', 1 - t); }).then(() => ring.remove());

  sparkleAt(x, y, 18, [MOONBOW[i], '#fff6c9', '#F7C948']);
  setGray(root, true);
  paintColors(root);
  updateCounter(root);
  await wait(1400);
}

// One sparkle-search area. cfg says where everything goes (see meadow/garden below).
// The fairy is under the 3rd sparkle she taps, or right away if she taps the hinted one.
function searchArea(root, cfg) {
  const i = cfg.fairy;
  worldLayers(root, cfg);
  sceneTitle(root, cfg.title);
  const actors = $('#actorsG', root);
  const lines = cfg.lines.map(text => ({ who: 'fairy' + i, text, ...cfg.bubble }));
  const finish = async () => {
    await talk(root, lines);
    bottomButton(root, cfg.nextLabel, () => go(cfg.next));
  };

  // Came back to this screen after already finding her? Skip the search.
  if (Save.data.found > i) {
    actors.insertAdjacentHTML('beforeend',
      `<g transform="translate(${cfg.fairyTo[0]},${cfg.fairyTo[1]}) scale(1.6)"><g class="bob">${drawFairy(i)}</g></g>`);
    finish();
    return;
  }

  const spots = document.createElementNS(SVGNS, 'g');
  spots.innerHTML = cfg.spots.map(([x, y], k) => sparkleSpot(x, y, k)).join('');
  actors.appendChild(spots);
  const pill = hintPill(root, STORY.searchHint, () => spots.querySelectorAll('.pulse').forEach(p => p.classList.add('strong')));

  let looked = 0, found = false;
  spots.querySelectorAll('.spot').forEach(spot => {
    onTap(spot, async () => {
      if (found || spot.dataset.done) return;
      spot.dataset.done = '1';
      looked++;
      const k = +spot.dataset.spot, [x, y] = cfg.spots[k];
      fadeOut(spot.parentNode);
      if (looked < 3 && k !== cfg.hintSpot) {
        floatText(root, x, y - 50, STORY.notHere[looked - 1]);
        return;
      }
      found = true;
      pill.remove();
      spots.querySelectorAll('.spot').forEach(s => { if (!s.dataset.done) fadeOut(s.parentNode); });
      await findFairy(root, i, [x, y], cfg.fairyTo);
      finish();
    }, 'sparkle');
  });
}

// The three girls standing together on the left of a Fairy World screen
function girlsLeft(ground = 650, s = 0.55) {
  return place('girl1', {}, 110, ground, s) + place('girl2', {}, 195, ground, s) + place('girl3', {}, 280, ground, s);
}

// One power card for the "We Have Powers!" screen
function powerCard(c) {

/* =========================================================
   POWER PUZZLES — the turn loop
     1. a fairy calls for help
     2. tap the Power Keeper's flower: the girls' powers wake up (they glow)
     3. tap the princess with the right power
        (wrong one: "Hmm, try another power!", and the right one gets a
         brighter glow and a bouncing arrow)
     4. she uses her power, the fairy comes out, and her color comes back
   ========================================================= */
const GIRLS = ['girl1', 'girl2', 'girl3'];
// Where everyone stands in a puzzle: ground line, size, and x of each character
const PZ = { ground: 600, s: 0.55, keeperX: 100, girlX: { girl1: 210, girl2: 300, girl3: 390 } };
const KEEPER_BUBBLE = { x: 30, y: 170, w: 400, tailX: 50 };

// Where the keeper's flower is on the stage
function keeperFlowerXY() {
  const b = BODY.keeper, s = PZ.s;
  const [sx, sy] = b.shoulderL, [dx, dy] = POSES.down.L;
  const hx = sx + dx * b.reach, hy = sy + dy * b.reach;   // her hand
  const fx = hx - 10, fy = hy - 48;                       // the flower on its stem
  return [PZ.keeperX - b.cx * s + fx * s, PZ.ground - b.feetY * s + fy * s];
}
// Top of a character's drawing on the stage
function topOf(name) { return PZ.ground - BODY[name].feetY * PZ.s; }

// cfg: fairy, title, back, front, tints, props (rock/mist/island),
//      need (which girl), intro, voiceBubble, usePower(root) -> [x, y] where the fairy appears,
//      solvedProps(root) (how things look once solved), fairyTo, bubble, doneLines, nextLabel, next
function powerPuzzle(root, cfg) {
  const i = cfg.fairy;
  const [flx, fly] = keeperFlowerXY();
  worldLayers(root, {
    ...cfg,
    actors: `<circle id="flowerGlow" cx="${flx}" cy="${fly}" r="62" fill="url(#charGlow)" opacity="0"/>` +
            cfg.props +
            placeTappable('keeper', {}, PZ.keeperX, PZ.ground, PZ.s) +
            GIRLS.map(n => placeTappable(n, {}, PZ.girlX[n], PZ.ground, PZ.s)).join('') +
            `<g transform="translate(${flx},${fly})"><circle id="flowerHit" r="60" fill="transparent"/></g>`,
  });
  sceneTitle(root, cfg.title);
  const actors = $('#actorsG', root);

  const finish = async () => {
    await talk(root, cfg.doneLines.map(text => ({ who: 'fairy' + i, text, ...cfg.bubble })));
    bottomButton(root, cfg.nextLabel, () => go(cfg.next));
  };

  // Came back after already solving it? Show it solved.
  if (Save.data.found > i) {
    cfg.solvedProps(root);
    setPerson(root, cfg.need, { pose: 'up', mouth: 'grin' });
    actors.insertAdjacentHTML('beforeend',
      `<g transform="translate(${cfg.fairyTo[0]},${cfg.fairyTo[1]}) scale(1.6)"><g class="bob">${drawFairy(i)}</g></g>`);
    finish();
    return;
  }

  let phase = 'intro', pill = null, arrow = null;
  const flowerGlow = $('#flowerGlow', root);

  // 1. The fairy calls for help
  talk(root, cfg.intro.map(line => ({ ...line, ...(line.who === 'keeper' ? KEEPER_BUBBLE : cfg.voiceBubble) })))
    .then(() => {
      phase = 'flower';
      flowerGlow.removeAttribute('opacity');
      flowerGlow.classList.add('pulse');
      pill = hintPill(root, STORY.flowerHint, () => flowerGlow.classList.add('strong'));
    });

  // 2. Tap the keeper's flower (or the keeper herself) to wake up the powers
  const wake = () => {
    if (phase !== 'flower') return;
    phase = 'pick';
    pill.remove();
    flowerGlow.remove();
    Sound.play('sparkle');
    sparkleAt(flx, fly, 16);
    floatText(root, flx + 120, fly - 150, STORY.powersAwake);
    GIRLS.forEach(n => setPerson(root, n, { glow: true }));
    pill = hintPill(root, STORY.pickHint, showHint);
  };
  onTap($('#pz-keeper', root), wake, 'sparkle');
  onTap($('#flowerHit', root), wake, 'sparkle');

  // After a wrong try: the right girl glows brighter and gets a bouncing arrow
  function showHint() {
    if (arrow || phase !== 'pick') return;
    setPerson(root, cfg.need, { glow: true, mouth: 'grin' });
    $('#pz-' + cfg.need + ' .pulse', root)?.classList.add('strong');
    arrow = document.createElementNS(SVGNS, 'g');
    arrow.setAttribute('transform', `translate(${PZ.girlX[cfg.need]},${topOf(cfg.need) - 24})`);
    arrow.innerHTML = '<g class="bob"><path class="s" d="M-20 -30 L20 -30 L0 4 Z" fill="#F7C948"/></g>';
    actors.appendChild(arrow);
  }

  // 3. Tap a princess
  GIRLS.forEach(n => onTap($('#pz-' + n, root), async () => {
    const wordsX = Math.max(260, PZ.girlX[n] + 40);
    if (phase === 'flower') {
      floatText(root, wordsX, topOf(n) - 20, STORY.flowerFirst);
      flowerGlow.classList.add('strong');
      return;
    }
    if (phase !== 'pick') return;
    if (n !== cfg.need) {
      Sound.play('hmm');
      floatText(root, wordsX, topOf(n) - 20, STORY.wrongPower);
      showHint();
      return;
    }
    // 4. The right princess uses her power!
    phase = 'power';
    pill.remove();
    if (arrow) arrow.remove();
    setPerson(root, n, { pose: 'power', mouth: 'grin', glow: true });
    const from = await cfg.usePower(root);
    GIRLS.forEach(g => setPerson(root, g, g === n ? { pose: 'up', mouth: 'grin' } : { mouth: 'grin' }));
    await findFairy(root, i, from, cfg.fairyTo);
    finish();
  }));
}


/* =========================================================
   SCREEN SYSTEM
   Each screen is a function in SCREENS that draws itself into `root`.
   go('name') fades to the next screen and saves progress.
   ========================================================= */
let currentScreen = null;
let changing = false;

function render(name) {
  const scene = $('#scene');
  scene.innerHTML = '';
  $('#fx').innerHTML = '';
  const root = el('div', 'screen', scene);
  currentScreen = name;
  (SCREENS[name] || SCREENS.title)(root);
  $('#hud').classList.toggle('on-title', name === 'title');
}

async function go(name) {
  if (changing) return;
  changing = true;
  const wipe = $('#wipe');
  wipe.classList.add('on');
  await wait(320);
  render(name);
  if (name !== 'title') { Save.data.screen = name; Save.write(); }
  await wait(80);
  wipe.classList.remove('on');
  await wait(300);
  changing = false;
}

      front: GROUND +
             '<ellipse class="s" cx="820" cy="604" rx="290" ry="60" fill="#5aa9d6"/><ellipse cx="780" cy="592" rx="190" ry="30" fill="#7fc4e8"/>' +
             '<path class="s" d="M640 610 A34 14 0 1 1 680 618 L660 610 Z" fill="#3fa36f"/><path class="s" d="M940 596 A30 12 0 1 1 976 602 L958 596 Z" fill="#3fa36f"/>' +
             bush(520, 548, 0.8) + bush(1200, 548, 0.9) +
             '<path class="s n" style="stroke:#1f6b47" d="M1080 600 L1074 520 M1096 604 L1100 510 M1112 600 L1122 530"/>' +
             grass(470, 650) + grass(1240, 650),
      // lavender irises and lily flowers bloom when the fourth fairy is found
      tints: flower(560, 615, 0.9, tint(3, lav)) + flower(1150, 625, 1, tint(3, lav)) + flower(1225, 610, 0.75, tint(3, lav)) +
             `<circle class="s" style="stroke-width:3" cx="662" cy="602" r="9" ${tint(3, lav)}/><circle class="s" style="stroke-width:3" cx="958" cy="588" r="8" ${tint(3, lav)}/>`,
      props: `<g id="ghost" transform="translate(820,450) scale(1.3)"><g class="shimmer"><g class="bob">${drawFairy(3, { glow: false })}</g></g></g>
        <g id="mist">${mist.map(([x, y, rx], k) =>
          `<g class="drift" style="animation-delay:${-k * 1.3}s"><ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${Math.round(rx * 0.28)}" fill="#f4f1ea" opacity=".6"/></g>`).join('')}</g>`,
      intro: STORY.pondIntro,
      voiceBubble: { x: 600, y: 130, w: 420, tailX: 200 },
      async usePower(root) {
        Sound.play('sparkle');
        await sparkleTrail([PZ.girlX.girl3 + 40, topOf('girl3') - 10], [820, 460], 9, 800);
        Sound.play('chime');
        sparkleAt(820, 460, 20);
        const mistG = $('#mist', root), ghost = $('#ghost', root);
        await tween(1000, t => { mistG.setAttribute('opacity', 1 - t); ghost.setAttribute('opacity', 1 - t); });
        mistG.remove();
        ghost.remove();
        return [820, 460];
      },
      solvedProps(root) { $('#mist', root).remove(); $('#ghost', root).remove(); },
      fairyTo: [700, 335],
      bubble: { x: 380, y: 56, w: 440, tailX: 300 },
      doneLines: STORY.pondDone,
      nextLabel: STORY.pondNext,
      next: 'cloud',
    });
  },

  /* ---------- 11. AREA 5: FLOATING CLOUD ISLAND (fairy 5 needs Teleport) ---------- */
  cloud(root) {
    const teal = MOONBOW[4];
    const IX = 1040, IY = 380;   // where the floating island is
    powerPuzzle(root, {
      fairy: 4,
      need: 'girl1',
      title: STORY.cloudTitle,
      back: fairySky('clSky', 89, '#2b4f8f', '#a8d8f0', false) +
            cloud(300, 300, 0.8, '#e6eef7') + cloud(760, 240, 1.1, '#e6eef7') + cloud(1200, 520, 0.9, '#e6eef7'),
      // a cliff on the left, a sea of clouds below, and the island far away
      front: '<path d="M0 520 Q240 500 520 524 Q600 532 640 560 L610 720 L0 720 Z" fill="#3fa36f" stroke="#1d1838" stroke-width="4"/>' +
             [640, 760, 880, 1000, 1120, 1240].map((x, k) => cloud(x, 730 - (k % 2) * 16, 1.3)).join('') +
             `<g transform="translate(${IX},${IY})">
                <path class="s" d="M-130 0 Q-70 100 0 120 Q70 100 130 0 Z" fill="#8a6a4a"/>
                <ellipse class="s" cx="0" cy="0" rx="136" ry="26" fill="#3fa36f"/>
                <path class="s n" style="stroke-width:3" d="M-60 40 L-40 70 M30 50 L50 86"/>
              </g>` +
             grass(470, 610) + grass(560, 600),
      // the island's little trees and the cliff flowers turn teal when the last fairy is found
      tints: `<g transform="translate(${IX - 95},${IY - 6})"><rect class="s" style="stroke-width:3" x="-5" y="-40" width="10" height="40" fill="#7a5235"/><circle class="s" style="stroke-width:3" cx="0" cy="-52" r="24" ${tint(4, teal)}/></g>` +
             `<g transform="translate(${IX + 100},${IY - 4})"><rect class="s" style="stroke-width:3" x="-5" y="-34" width="10" height="34" fill="#7a5235"/><circle class="s" style="stroke-width:3" cx="0" cy="-44" r="20" ${tint(4, teal)}/></g>` +
             flower(500, 600, 0.9, tint(4, teal)) + flower(590, 590, 0.7, tint(4, teal)),
      props: `<g id="farFairy" transform="translate(${IX + 20},${IY - 60}) scale(.6)"><g class="bob">${drawFairy(4)}</g></g>`,
      intro: STORY.cloudIntro,
      voiceBubble: { x: 640, y: 124, w: 400, tailX: 330 },
      async usePower(root) {
        const actors = $('#actorsG', root), me = $('#pz-girl1', root);
        const gx = PZ.girlX.girl1, gy = PZ.ground - 90;
        // Poof! She vanishes...
        Sound.play('poof'); sparkleAt(gx, gy, 16);
        await tween(250, t => me.setAttribute('opacity', 1 - t));
        // ...and pops up on the island next to the fairy
        const there = document.createElementNS(SVGNS, 'g');
        there.innerHTML = place('girl1', { pose: 'up', mouth: 'grin' }, IX - 35, IY - 8, 0.3);
        there.setAttribute('opacity', 0);
        actors.appendChild(there);
        await wait(250);
        Sound.play('poof'); sparkleAt(IX - 35, IY - 60, 16);
        await tween(250, t => there.setAttribute('opacity', t));
        await wait(1000);
        // Poof! Both of them zip back
        const far = $('#farFairy', root);
        Sound.play('poof'); sparkleAt(IX - 10, IY - 60, 22);
        await tween(250, t => { there.setAttribute('opacity', 1 - t); far.setAttribute('opacity', 1 - t); });
        there.remove();
        far.remove();
        await wait(250);
        Sound.play('poof'); sparkleAt(gx, gy, 16);
        await tween(250, t => me.setAttribute('opacity', t));
        return [gx + 80, gy - 60];
      },
      solvedProps(root) { $('#farFairy', root).remove(); },
      fairyTo: [700, 335],
      bubble: { x: 380, y: 56, w: 440, tailX: 300 },
      doneLines: STORY.cloudDone,
      nextLabel: STORY.cloudNext,
      next: 'finale',
    });
  },

  /* ---------- 12. THE MOONBOW RETURNS (coming in build step 5) ---------- */
  finale(root) {
    root.innerHTML = `
      <svg class="bg" viewBox="0 0 1280 720" aria-hidden="true">
        <defs><linearGradient id="fnSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151236"/><stop offset="1" stop-color="#4a3f8a"/></linearGradient></defs>
        <rect width="1280" height="720" fill="url(#fnSky)"/>
        ${starsSVG(50, 3, 500)}
        ${moonbowArc(640, 560, 490, 440, 26)}
      </svg>`;
    const card = el('div', 'card', root);
    card.style.cssText = 'top:300px;width:700px;background:rgba(29,24,56,.85)';
    card.innerHTML = 'The Moonbow Returns!<br><span style="font-size:24px;opacity:.8">(The ending is coming soon.)</span>';
    bottomButton(root, 'Back to the start', () => go('title'));
  },
};


/* =========================================================
   GROWN-UP BUTTONS: mute + start over
   ========================================================= */
function drawMuteIcon() {
  const muted = Save.data.muted;
  $('#muteBtn').innerHTML = `<svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true">
    <path d="M8 18 L16 18 L26 9 L26 39 L16 30 L8 30 Z" fill="#fff"/>
    ${muted
      ? '<path d="M32 18 L42 30 M42 18 L32 30" stroke="#fff" stroke-width="4" stroke-linecap="round"/>'
      : '<path d="M32 17 Q37 24 32 31 M36 12 Q45 24 36 36" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>'}
  </svg>`;
}
$('#muteBtn').addEventListener('click', () => {
  Save.data.muted = !Save.data.muted;
  Save.write();
  drawMuteIcon();
  Sound.play('pop');
});
$('#restartBtn').addEventListener('click', () => {
  if (confirm('Start the whole game over from the beginning?')) {
    Save.reset();
    go('title');
  }
});


/* =========================================================
   FIT THE STAGE TO THE SCREEN (letterboxed 16:9)
   ========================================================= */
function fit() {
  const w = window.innerWidth, h = window.innerHeight;
  stageScale = Math.min(w / 1280, h / 720);
  const x = (w - 1280 * stageScale) / 2, y = (h - 720 * stageScale) / 2;
  stage.style.transform = `translate(${x}px, ${y}px) scale(${stageScale})`;
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => setTimeout(fit, 200));


/* =========================================================
   START
   ========================================================= */
Save.load();
drawMuteIcon();
fit();
render('title');
</script>
</body>
</html>
